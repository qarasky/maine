name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Config format validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema examples (Python 3 stdlib only)
        run: python3 tools/validate.py
        working-directory: packages/schema

  macos:
    name: macOS app (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode (SwiftUI macros need Xcode 16+)
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          swift --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sync-server
      - name: Build the sync server for the client integration tests
        run: cargo build --release --locked
        working-directory: apps/sync-server
      - name: Build and test
        env:
          # Force the Swift backtracer: its default is tuned for interactive
          # terminals, and a CI crash without a stack is not diagnosable.
          # This is how the empty-environment crash behind the 2026-10-12
          # macOS failures was found.
          SWIFT_BACKTRACE: "enable=yes,symbolicate=yes"
          # Enables SyncServerIntegrationTests: the macOS client against the
          # real Rust server.
          MAINE_SYNC_SERVER_BIN: ${{ github.workspace }}/apps/sync-server/target/release/maine-sync-server
        run: swift test
        working-directory: apps/macos

  windows-core:
    name: Windows core (Core build + tests, any OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Core
        run: dotnet build src/Maine.Core/Maine.Core.csproj --nologo
        working-directory: apps/windows
      - name: Test Core (incl. Swift-produced vault fixture)
        run: dotnet test tests/Maine.Core.Tests/Maine.Core.Tests.csproj --nologo
        working-directory: apps/windows

  windows-app:
    name: Windows app (WPF compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Vendor xterm.js for the terminal page
        run: sh scripts/fetch-xterm.sh
        working-directory: apps/windows
        shell: bash
      - name: Build full solution (Core + tests + WPF app)
        run: dotnet build Maine.sln --nologo
        working-directory: apps/windows
      - name: Verify the terminal libraries are packaged
        shell: bash
        working-directory: apps/windows
        run: |
          for asset in xterm.js xterm.css xterm-addon-fit.js; do
            found="$(find src/Maine.App/bin -path "*/Terminal/lib/$asset" -print -quit)"
            if [ -z "$found" ]; then
              echo "::error::Terminal/lib/$asset is missing from the build output"
              exit 1
            fi
          done
      - name: Test Core on Windows (ACL + DPAPI-adjacent paths)
        run: dotnet test tests/Maine.Core.Tests/Maine.Core.Tests.csproj --nologo --no-build
        working-directory: apps/windows

  android:
    name: Android app (Kotlin unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install platform + build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests (JVM, no emulator; incl. Swift-generated golden vault)
        run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: apps/android

  sync-server:
    name: Sync server (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sync-server
      - name: Format
        run: cargo fmt --check
        working-directory: apps/sync-server
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/sync-server
      - name: Test (unit + HTTP integration against a real server)
        run: cargo test --locked
        working-directory: apps/sync-server
