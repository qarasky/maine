[package]
name = "maine-sync"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Sync client for Maine: profiles, HTTP transport, whole-file engine and coordinator. Qt-free."

[dependencies]
maine-core = { path = "../maine-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
