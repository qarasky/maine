[package]
name = "maine-engine"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Qt-free application core of the Maine Linux client: host store, sessions, askpass, lock state."

[dependencies]
maine-core = { path = "../maine-core" }
maine-term = { path = "../maine-term" }
rustix = { version = "1", features = ["net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
